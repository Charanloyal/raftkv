syntax = "proto3";

package raftkv;

enum OpType {
  PUT = 0;
  GET = 1;
  DELETE = 2;
  NOOP = 3;
}

message LogEntry {
  uint64 index = 1;
  uint64 term = 2;
  OpType op = 3;
  string key = 4;
  string value = 5;
  string client_id = 6;
  uint64 sequence_num = 7;
}

message RequestVoteArgs {
  uint64 term = 1;
  string candidate_id = 2;
  uint64 last_log_index = 3;
  uint64 last_log_term = 4;
}

message RequestVoteReply {
  uint64 term = 1;
  bool vote_granted = 2;
}

message AppendEntriesArgs {
  uint64 term = 1;
  string leader_id = 2;
  uint64 prev_log_index = 3;
  uint64 prev_log_term = 4;
  repeated LogEntry entries = 5;
  uint64 leader_commit = 6;
}

message AppendEntriesReply {
  uint64 term = 1;
  bool success = 2;
  uint64 match_index = 3;
  uint64 conflict_index = 4;
  uint64 conflict_term = 5;
}

message SnapshotArgs {
  uint64 term = 1;
  string leader_id = 2;
  uint64 last_included_index = 3;
  uint64 last_included_term = 4;
  uint64 offset = 5;
  bytes data = 6;
  bool done = 7;
}

message SnapshotReply {
  uint64 term = 1;
}

message PutArgs {
  string key = 1;
  string value = 2;
  string client_id = 3;
  uint64 sequence_num = 4;
}

message PutReply {
  bool success = 1;
  string error = 2;
  string leader_id = 3;
  string leader_address = 4;
}

message GetArgs {
  string key = 1;
  string client_id = 2;
  uint64 sequence_num = 3;
}

message GetReply {
  bool success = 1;
  string value = 2;
  bool found = 3;
  string error = 4;
  string leader_id = 5;
  string leader_address = 6;
}

message DeleteArgs {
  string key = 1;
  string client_id = 2;
  uint64 sequence_num = 3;
}

message DeleteReply {
  bool success = 1;
  string error = 2;
  string leader_id = 3;
  string leader_address = 4;
}

service RaftConsensus {
  rpc RequestVote (RequestVoteArgs) returns (RequestVoteReply);
  rpc AppendEntries (AppendEntriesArgs) returns (AppendEntriesReply);
  rpc InstallSnapshot (SnapshotArgs) returns (SnapshotReply);
}

service ClientService {
  rpc Put (PutArgs) returns (PutReply);
  rpc Get (GetArgs) returns (GetReply);
  rpc Delete (DeleteArgs) returns (DeleteReply);
}
